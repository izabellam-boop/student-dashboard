<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bella's Student Dashboard</title>

    <style>
        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#f5f7fb;
            color:#333;
        }

        header{
            background:#7c6ee6;
            color:white;
            padding:25px;
            text-align:center;
        }

        .container{
            max-width:1100px;
            margin:40px auto;
            padding:20px;
        }

        .card{
            background:white;
            border-radius:18px;
            padding:30px;
            box-shadow:0 10px 25px rgba(0,0,0,.08);
        }

        h2{
            margin-top:0;
        }

        button{
            background:#7c6ee6;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:10px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#6658d6;
        }
    </style>
</head>

<body>

<header>
    <h1>🎓 Bella's Student Dashboard</h1>
    <p>Your personal academic command center</p>
</header>

<div class="container">

<div class="card">

<h2>Welcome! 🌸</h2>

<p>If you're seeing this page, your website is working!</p>

<button onclick="alert('Your dashboard is coming soon! 🎉')">
Click Me
</button>

</div>

</div>

</body>
</html>
